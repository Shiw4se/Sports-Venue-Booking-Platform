name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  frontend:
    name: Frontend — tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
        env:
          CI: true
      - run: npm run build
        env:
          CI: true

  e2e:
    name: Backend — end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: SportCourts
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/*/package-lock.json

      - name: Install backend dependencies
        run: |
          for s in api-gateway user-service venue-service booking-service notification-service; do
            npm ci --prefix backend/$s
          done

      - name: Apply database schema
        run: psql "postgres://postgres:postgres@localhost:5432/SportCourts" -v ON_ERROR_STOP=1 -f backend/db/init.sql

      - name: Configure services
        run: |
          for s in api-gateway user-service venue-service booking-service notification-service; do
            cp backend/$s/.env.example backend/$s/.env
          done

      - name: Start services
        run: |
          mkdir -p logs
          for s in user-service venue-service booking-service notification-service api-gateway; do
            # short reminder interval so the e2e reminder check does not wait 5 minutes
            (cd backend/$s && REMINDER_INTERVAL_MS=2000 REMINDER_START_DELAY_MS=3000 nohup node app.js > ../../logs/$s.log 2>&1 &)
          done
          for i in $(seq 1 30); do
            curl -fs http://localhost:3000/api/health && exit 0
            sleep 2
          done
          echo "Services did not become healthy" && exit 1

      - name: Run end-to-end tests
        run: node backend/tests/e2e.test.js

      - name: Service logs
        if: always()
        run: tail -n 100 logs/*.log
